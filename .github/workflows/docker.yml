name: Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/production-devops-app:${IMAGE_TAG} .

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/production-devops-app:${IMAGE_TAG}

      - name: Copy Kubernetes manifests
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "kubernetes/*"
          target: "/home/ubuntu/"

      - name: Deploy to Kubernetes
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo k3s kubectl apply -f /home/ubuntu/kubernetes/app-deployment.yml
            sudo k3s kubectl apply -f /home/ubuntu/kubernetes/service.yml

            sudo k3s kubectl set image deployment/devops-app \
              devops-app=${{ secrets.DOCKER_USERNAME }}/production-devops-app:${{ github.sha }}

            sudo k3s kubectl rollout status deployment/devops-app
